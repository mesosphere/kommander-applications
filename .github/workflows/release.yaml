name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish and index on proxy.golang.org."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted-nutanix-small
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  publish:
    needs: release-please
    if: |
      !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag) ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: self-hosted-nutanix-small
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.release-please.outputs.release_created }}" == "true" ]]; then
            echo "name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.name }}

      - name: Create GitHub Release
        if: needs.release-please.outputs.release_created != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true

      - name: Index module on proxy.golang.org
        env:
          MODULE: github.com/nutanix-cloud-native/nkp-catalog-tests
          VERSION: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          info_url="https://proxy.golang.org/${MODULE}/@v/${VERSION}.info"
          echo "Requesting ${info_url}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${info_url}"
          echo
          echo "Indexed ${MODULE}@${VERSION}"
