name: "Update app-labeler.yaml"
on:
  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - 'applications/**/*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-app-labels-yaml:
    runs-on: self-hosted-nutanix-small
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Install NIX
        uses: cachix/install-nix-action@v31

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          skip-nix-installation: true
          enable-cache: 'false'
          refresh-cli: 'true'

      - run: devbox run -- gh auth setup-git

      - name: Update .github/app-labeler.yaml
        run: make workflow-labeler-yaml-update
      - name: Commit and push changes
        run: |
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com}"
          git config user.name "${GITHUB_ACTOR}"
          git add .github/app-labeler.yaml
          if output=$(git status --porcelain) && [ ! -z "$output" ]; then
            git commit -v -m "build: Updated .github/app-labeler.yaml"
            git push --force-with-lease
          fi
