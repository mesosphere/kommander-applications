repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        files: \.go$
        pass_filenames: false
      - id: shfmt
        name: shfmt
        entry: shfmt
        language: system
        files: \.sh$
        args:
          - --write
          - --indent
          - "2"
          - --case-indent
