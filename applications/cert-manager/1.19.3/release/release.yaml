---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-${appVersion}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  url: "oci://quay.io/jetstack/charts/cert-manager"
  ref:
    tag: v1.19.3
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-${appVersion}-crds
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  url: "oci://ghcr.io/mesosphere/charts/cert-manager-crds"
  ref:
    tag: v1.19.3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-${appVersion}-chart
    namespace: ${releaseNamespace}
  interval: 15s
  install:
    serverSideApply: true
    crds: CreateReplace
    remediation:
      retries: 30
    createNamespace: true
  upgrade:
    serverSideApply: enabled
    crds: CreateReplace
    remediation:
      retries: 30
  rollback:
    serverSideApply: enabled
  releaseName: cert-manager
  targetNamespace: cert-manager
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-config-defaults
    # this is needed to support NAI
    - kind: ConfigMap
      name: cert-manager-gateway-api-crds-${releaseNamespace}-overrides
      optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-crds
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-${appVersion}-crds
    namespace: ${releaseNamespace}
  interval: 15s
  install:
    serverSideApply: true
    remediation:
      retries: 30
    createNamespace: true
    crds: CreateReplace
  upgrade:
    serverSideApply: enabled
    remediation:
      retries: 30
    crds: CreateReplace
  rollback:
    serverSideApply: enabled
  releaseName: cert-manager-crds
  targetNamespace: cert-manager
