apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The name should be made consistent with one generated
# by the KommanderAppDeployment controller.
#
# Also see federation/pkg/controllers/embedded/federated-manifests-cluster/prerequisites/
resources:
  - ../2.3.0/
patches:
  - patch: |
      - op: replace
        path: /metadata/name
        value: external-secrets
    target:
      kind: HelmRelease
      name: external-secrets
