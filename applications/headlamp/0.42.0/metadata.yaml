overview: |-
  # Overview
  Headlamp provides a modern Kubernetes dashboard for per-cluster visibility.

  In NKP, Headlamp is configured as a locked-down visibility layer:
  - Integrated with NKP ingress and forward auth for SSO access.
  - Plugin system is disabled.
  - App catalog extensibility is disabled.
  - Read-only permissions are used by default.

  ## More Information
  - [Headlamp Documentation](https://headlamp.dev/)
  - [Headlamp - GitHub](https://github.com/kubernetes-sigs/headlamp)
