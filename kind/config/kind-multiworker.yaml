kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: "172.16.0.0/16"
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    extraMounts:
      # This works on ubuntu but not on Mac with colima - on a Mac the path would be ./testdata/rook-ceph/scripts/
      - hostPath: ./tmp-kind-hack-scripts
        containerPath: /hack/scripts
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
    image: kindest/node:v1.34.0
    extraMounts:
      - hostPath: ./tmp-kind-hack-scripts
        containerPath: /hack/scripts
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  # Second worker is only used by tests that explicitly opt in via
  # SetupKindClusterMultiWorker (currently the Knative PDB Drain Resilience
  # test, which cordons one worker and needs a sibling node to receive the
  # evicted webhook pods). Carries no special labels or mounts: ingress-ready
  # is unused in this repo, and the rook-ceph hack-scripts mount only needs
  # to be present on at least one node, which the first worker already has.
  - role: worker
    image: kindest/node:v1.34.0
